<style>

<body>
<div id="jl">
  <!-- layar loading ala Juragan Warnet -->
  <div id="jl-load" role="status" aria-label="Memuat game">
    <div class="ld-card">
      <div class="ld-logo">🧺</div>
      <h1>Juragan Laundry</h1>
      <p class="ld-sub">Laundry Berkah · Cuci Kiloan</p>
      <div class="ld-bar"><i id="jl-load-i"></i></div>
      <div class="ld-pct" id="jl-load-p">0%</div>
      <div class="ld-txt" id="jl-load-t">Nyalain mesin cuci…</div>
      <div class="ld-mach" aria-hidden="true">🌀 ♨️ 👔</div>
      <div class="ld-buka" id="jl-load-b"></div>
    </div>
  </div>
  <canvas id="cv" aria-label="Toko laundry 3D low-poly — geser untuk melihat sekeliling"></canvas>

  <!-- HUD ramping satu baris: Rp · bintang · berlian · hari/Lv · jam + ikon kecil. Detail (energi/toko/antrian) sembunyi sampai diklik ⌄ -->
  <div class="hud" role="region" aria-label="Status game">
    <div class="c"><span class="coin">Rp</span><span id="jl-uang">600rb</span></div>
    <div class="c"><span class="coin star">★</span><b id="jl-rat">4,1</b></div>
    <span class="ber">💎 <span id="jl-ber">20</span></span>
    <div class="rt">
      <small id="jl-tgl">Hari 1 · Lv. 1</small>
      <b id="jl-jam">08.00</b>
    </div>
    <div class="hud-icons">
      <button class="abtn ic" id="btn-musik" aria-label="Matikan / nyalakan musik" title="Musik">🎵</button>
      <button class="abtn ic" id="btn-sfx" aria-label="Matikan / nyalakan efek suara" title="SFX">🔊</button>
      <button class="abtn ic" id="btn-suara" aria-label="Matikan / nyalakan suara ngomong pelanggan" title="Suara pelanggan">🗣️</button>
      <button class="abtn ic" id="btn-hud-more" aria-label="Tampilkan info toko, energi dan antrian" title="Info toko & energi" aria-expanded="false">⌄</button>
    </div>
  </div>
  <div class="hud-detail" id="jl-hud-detail" hidden>
    <div class="c"><span class="coin bolt">⚡</span><div class="ebar"><i id="jl-en" style="width:0%"></i><span class="ent" id="jl-ent">0/70</span></div><span class="note2">XP ke level berikutnya</span></div>
    <div class="chiprow">
      <span class="lvn" id="jl-lvn">🏠 Laundry Berkah · Toko Kecil</span>
      <span class="lvn stp" id="jl-stat">● 0 antri · 👥 0 karyawan · ✅ Selesai: 0 · Hari ini Rp 0</span>
    </div>
  </div>

  <!-- tombol bundar kanan -->
  <div class="side">
    <button class="rb" id="btn-misi" aria-label="Misi">🎯<span class="dot" id="dot-misi">!</span><small>Misi</small></button>
    <button class="rb pass" id="btn-topup" aria-label="Top Up">🎫<small>Top Up</small></button>
    <button class="rb" id="btn-order" aria-label="Order">🧺<span class="dot" id="dot-order" hidden>0</span><small>Order</small></button>
    <button class="rb gold" id="btn-paket" aria-label="Paket">🎁<small>Paket</small></button>
  </div>
  <!-- tombol bundar kiri -->

<script>
/* ================================================================

   (stickology-web): ortho iso CAM th=PI/4 ph=.62, primitif

   Slot PC diganti mesin cuci / pengering / meja setrika.

/* ===== mesin 3D low-poly mini (persis Juragan Warnet) ===== */
var F=[],ST=[],LAY=2,CAST=true;
function hex(c){var n=parseInt(c.slice(1),16);return[n>>16,n>>8&255,n&255]}
function tf1(p,o){var x=p[0]*(o.s||1),y=p[1]*(o.s||1),z=p[2]*(o.s||1),c,s,t;
  if(o.rz){c=Math.cos(o.rz);s=Math.sin(o.rz);t=x*c-y*s;y=x*s+y*c;x=t}
  if(o.rx){c=Math.cos(o.rx);s=Math.sin(o.rx);t=y*c-z*s;z=y*s+z*c;y=t}
  if(o.ry){c=Math.cos(o.ry);s=Math.sin(o.ry);t=x*c+z*s;z=-x*s+z*c;x=t}
  return[x+(o.x||0),y+(o.y||0),z+(o.z||0)]}
function tf(p){for(var i=ST.length-1;i>=0;i--)p=tf1(p,ST[i]);return p}
function grp(o,fn){ST.push(o);fn();ST.pop()}
function face(pts,c,em){var tp=pts.map(tf);if(LAY===0&&newell(tp)[1]<0)tp.reverse();F.push({p:tp,c:hex(c),L:LAY,cs:CAST&&LAY===2,em:em})}
function box(x0,y0,z0,x1,y1,z1,c,em){var v=[[x0,y0,z0],[x1,y0,z0],[x1,y1,z0],[x0,y1,z0],[x0,y0,z1],[x1,y0,z1],[x1,y1,z1],[x0,y1,z1]];
  [[0,3,2,1],[4,5,6,7],[0,1,5,4],[2,3,7,6],[1,2,6,5],[0,4,7,3]].forEach(function(f){face(f.map(function(i){return v[i]}),c,em)})}
function newell(p){var nx=0,ny=0,nz=0;for(var i=0;i<p.length;i++){var a=p[i],b=p[(i+1)%p.length];nx+=(a[1]-b[1])*(a[2]+b[2]);ny+=(a[2]-b[2])*(a[0]+b[0]);nz+=(a[0]-b[0])*(a[1]+b[1])}var m=Math.hypot(nx,ny,nz)||1;return[nx/m,ny/m,nz/m]}
function out(pts,cen){var n=newell(pts),m=[0,0,0];pts.forEach(function(q){m[0]+=q[0];m[1]+=q[1];m[2]+=q[2]});m=m.map(function(v){return v/pts.length});return(n[0]*(m[0]-cen[0])+n[1]*(m[1]-cen[1])+n[2]*(m[2]-cen[2])<0)?pts.slice().reverse():pts}

  if(ax==='y'){A.push([cx+u*r,cy,cz+v*r]);B.push([cx+u*r2,cy+h,cz+v*r2])}else if(ax==='x'){A.push([cx,cy+u*r,cz+v*r]);B.push([cx+h,cy+u*r2,cz+v*r2])}else{A.push([cx+u*r,cy+v*r,cz]);B.push([cx+u*r2,cy+v*r2,cz+h])}}

var ICO=(function(){var t=(1+Math.sqrt(5))/2,v=[[-1,t,0],[1,t,0],[-1,-t,0],[1,-t,0],[0,-1,t],[0,1,t],[0,-1,-t],[0,1,-t],[t,0,-1],[t,0,1],[-t,0,-1],[-t,0,1]].map(function(p){var m=Math.hypot(p[0],p[1],p[2]);return p.map(function(a){return a/m})}),
  f=[[0,11,5],[0,5,1],[0,1,7],[0,7,10],[0,10,11],[1,5,9],[5,11,4],[11,10,2],[10,7,6],[7,1,8],[3,9,4],[3,4,2],[3,2,6],[3,6,8],[3,8,9],[4,9,5],[2,4,11],[6,2,10],[8,6,7],[9,8,1]],o=[];
  function mid(a,b){var p=[(a[0]+b[0])/2,(a[1]+b[1])/2,(a[2]+b[2])/2],m=Math.hypot(p[0],p[1],p[2]);return p.map(function(x){return x/m})}
  f.forEach(function(t3){var a=v[t3[0]],b=v[t3[1]],c=v[t3[2]],ab=mid(a,b),bc=mid(b,c),ca=mid(c,a);o.push([a,ab,ca],[b,bc,ab],[c,ca,bc],[ab,bc,ca])});return o})();
function sph(cx,cy,cz,r,c,sy,cut){sy=sy||1;ICO.forEach(function(t3){var p=t3.map(function(q){return[cx+q[0]*r,cy+q[1]*r*sy,cz+q[2]*r]});if(cut!=null&&p.every(function(q){return q[1]<cut}))return;face(out(p,[cx,cy,cz]),c)})}

/* ===== kamera ortho iso (persis Juragan Warnet) ===== */
var cv=document.getElementById('cv'),ctx=cv.getContext('2d'),W=0,H=0,D=1,S=28;
var CAM={th:Math.PI/4,ph:.62},Rv,Uv,Fv,BX0,BY0,BW,BH,PAN={x:0,y:0};
var LIT=(function(){var v=[-.4,.85,.35],m=Math.hypot(v[0],v[1],v[2]);return v.map(function(a){return a/m})})();
function dot(a,b){return a[0]*b[0]+a[1]*b[1]+a[2]*b[2]}
function camSetup(){var c=Math.cos(CAM.ph),s=Math.sin(CAM.ph),dv=[c*Math.sin(CAM.th),s,c*Math.cos(CAM.th)];Fv=dv.map(function(a){return-a});var r=[-Fv[2],0,Fv[0]],m=Math.hypot(r[0],r[2]);Rv=[r[0]/m,0,r[2]/m];

function pr(p){return{x:dot(p,Rv)*S,y:-dot(p,Uv)*S}}
function wc(x,y,z){var q=pr([x,y,z]);return{x:q.x-BX0,y:q.y-BY0}}
function ws(x,y,z){var q=wc(x,y,z);return{x:q.x-PAN.x,y:q.y-PAN.y}}
function paint(c,faces,ox,oy,shade){var list=[];faces.forEach(function(fc){var n=newell(fc.p);if(dot(n,Fv)>=0)return;var cx=0,cy=0,cz=0;fc.p.forEach(function(q){cx+=q[0];cy+=q[1];cz+=q[2]});var m=fc.p.length;
    var li=Math.max(0,dot(n,LIT)),k=fc.em?1.05:(.68+.4*li+.06*Math.max(0,n[1]));list.push({L:fc.L,d:dot([cx/m,cy/m,cz/m],Fv),pts:fc.p.map(function(q){var a=pr(q);return[ox+a.x,oy+a.y]}),c:'rgb('+fc.c.map(function(v){return Math.min(255,Math.round(v*k))})+')'})});
  list.sort(function(a,b){return a.L-b.L||b.d-a.d});var done=false;
  list.forEach(function(f){c.beginPath();f.pts.forEach(function(p,i){if(i)c.lineTo(p[0],p[1]);else c.moveTo(p[0],p[1])});c.closePath();c.fillStyle=f.c;c.fill()})}
function layer(build,withShadow){var cnv=document.createElement('canvas');cnv.width=Math.ceil(BW*D);cnv.height=Math.ceil(BH*D);var c=cnv.getContext('2d');c.setTransform(D,0,0,D,0,0);
  F=[];ST=[];build();var faces=F,ox=-BX0,oy=-BY0;
  var sh=withShadow?function(){var sc=document.createElement('canvas');sc.width=cnv.width;sc.height=cnv.height;var s2=sc.getContext('2d');s2.setTransform(D,0,0,D,0,0);s2.fillStyle='#4A3A2A';
    faces.forEach(function(fc){if(!fc.cs)return;s2.beginPath();fc.p.forEach(function(v,i){var t=v[1]/LIT[1],a=pr([v[0]-LIT[0]*t,.04,v[2]-LIT[2]*t]);if(i)s2.lineTo(ox+a.x,oy+a.y);else s2.moveTo(ox+a.x,oy+a.y)});s2.closePath();s2.fill()});
    c.save();c.globalAlpha=.18;c.drawImage(sc,0,0,BW,BH);c.restore()}:null;

var SPR={};
function sprite(key,fn){F=[];ST=[];LAY=2;CAST=false;fn();var faces=F,mnx=1e9,mny=1e9,mxx=-1e9,mxy=-1e9;faces.forEach(function(fc){fc.p.forEach(function(q){var a=pr(q);mnx=Math.min(mnx,a.x);mny=Math.min(mny,a.y);mxx=Math.max(mxx,a.x);mxy=Math.max(mxy,a.y)})});
  var pad=3,w=mxx-mnx+pad*2,h=mxy-mny+pad*2,c=document.createElement('canvas');c.width=Math.max(1,Math.ceil(w*D));c.height=Math.max(1,Math.ceil(h*D));var x=c.getContext('2d');x.setTransform(D,0,0,D,0,0);paint(x,faces,-mnx+pad,-mny+pad);SPR[key]={c:c,ax:-mnx+pad,ay:-mny+pad,w:w,h:h}}

var DIRS=[0,Math.PI/2,Math.PI,-Math.PI/2];

  })}
var RAMBUT=['#2B1B0E','#1B1B1B','#5A3A22'];
/* tipe pelanggan laundry: outfit chibi */

/* suara ngomong gibberish ala Animal Crossing: blip pendek beruntun, nada khas tiap karakter, panjang ngikutin kalimat */
function voiceBlip(p,txt){ if(typeof AU==='undefined'||!AU.ctx||AU.voiceOn===false)return;
  var now=Date.now()/1000;
  /* anti-berisik: cuma satu suara ngomong dalam satu waktu + jeda minimum per karakter,
     biar blip dari banyak pelanggan / pemicu beruntun nggak numpuk & overlap */
  if(AU._voiceUntil&&now<AU._voiceUntil)return;
  if(p._lastVoice&&now-p._lastVoice<3)return;
  var seed=(p.id||1)*7+((p.v||0)*13);
  var base=300+((seed*37)%260); /* 300–560 Hz, beda tiap orang */
  var words=Math.max(1,Math.min(6,Math.round(txt.length/6)));
  p._lastVoice=now; AU._voiceUntil=now+words*.09+.6;
  for(var i=0;i<words;i++){ var wob=((seed*(i+3)*53)%90)-45; var f=base+wob+(i%3===2?40:0);
    auTone(f,i*.09,.07,'triangle',.03); }
}

function slotForStage(stage,k){

function assignWork(){
  var workers=PEOPLE.filter(function(p){return p.kind==='staff'||p.kind==='boss'});
  var jobs=[];
  [1,3,5].forEach(function(stage){
    var n=busyCount(stage);
    for(var k=0;k<n;k++){ var s=slotForStage(stage,k); if(s) jobs.push({stage:stage,slot:s,pose:stage===1?'cuci':stage===3?'oper':'gosok'}); }

    });
    if(!cand){
      var best=null,bestScore=-1;
      workers.forEach(function(p){
        if(used[p.id])return;
        var score=Math.random();
        if(p.kind==='staff'){ var s=state.staffList[p.staffIdx]; if(s&&(s.stage===job.stage||s.stage===0)) score+=5; if(p.kind==='staff'&&s&&s.stage===6) score-=2; }
        if(p.kind==='boss') score+=0.5;
        if(score>bestScore){bestScore=score;best=p;}

      cand=best;
    }
    if(!cand)return;
    used[cand.id]=true;
    cand.task={stage:job.stage}; cand.slotI=job.slot.i; cand.workPose=job.pose;
    var tx=job.slot.cx, tz=job.slot.cz;
    if(Math.hypot(cand.x-tx,cand.z-tz)>.25){
      cand.path=[[tx,tz,0]]; cand.st='keKerja';
      cand.dir=job.slot.row===1?2:job.slot.row===2?1:3;
    } else if(cand.st==='keKerja'){
      cand.st='kerja'; cand.path=[];
      cand.dir=job.slot.row===1?2:job.slot.row===2?1:3;

    if(used[p.id])return;

function buyUpgrade(id){ var u=UPGRADES.filter(function(x){return x.id===id})[0]; if(!u||!u.can()) return; var cost=u.cost(); if(state.money<cost){ toast("Uang belum cukup buat "+u.name); sfx('error'); return; } state.money-=cost; u.apply(); toast("🎉 Berhasil beli: "+u.name); sfx('koin'); if(id==='ac')rebuildLayers(); ui(); }
function buyGemItem(id){ var g=GEM_ITEMS.filter(function(x){return x.id===id})[0]; if(!g) return; if(state.gems<g.gems){ toast("Berlian belum cukup."); return; } if(g.apply()===false){ toast("Item ini sudah aktif."); return; } state.gems-=g.gems; toast("💎 "+g.name+" dipakai!"); ui(); }
function claimMission(id){ var m=MISSIONS.filter(function(x){return x.id===id})[0]; if(!m||state.claimedMissions[id]) return; state.claimedMissions[id]=true; state.money+=m.rewardMoney; state.gems+=m.rewardGems; toast("🎯 Misi '"+m.name+"' diklaim! +"+fmt(m.rewardMoney)+" + "+m.rewardGems+" 💎"); ui(); }

/* ================= SIKLUS HARI ================= */
function endDay(){
  var rent=150000, gaji=staffSalaryTotal(), ops=30000 + state.washers*5000, side=sideIncome();
  var out=rent+gaji+ops;
  state.money-=out; state.dayCost+=out;
  if(side>0){ state.money+=side; state.dayIncome+=side; }
  sfx('koin');
  $('jl-rep-b').innerHTML='<h3>🌙 Laundry tutup</h3><p>Laporan hari ke-'+state.day+'</p>'
    +'<div class="kv"><span>Pemasukan laundry</span><b class="pos">'+fmt(state.dayIncome-side)+'</b><span>Usaha sampingan</span><b class="pos">+'+fmt(side)+'</b><span>Order selesai</span><b>'+state.dayOrders+'</b><span>Sewa</span><b>-'+fmt(rent)+'</b><span>Gaji karyawan ('+state.staffList.length+' orang)</span><b>-'+fmt(gaji)+'</b><span>Operasional</span><b>-'+fmt(ops)+'</b><span>Total biaya hari ini</span><b class="neg">-'+fmt(state.dayCost)+'</b><span>Saldo akhir</span><b>'+fmt(state.money)+'</b><span>Pelanggan selesai</span><b>'+state.totalDone+' (reputasi '+Math.round(state.reputation)+'%)</b></div>';
  $('jl-rep').hidden=false;
}
function nextDay(){
  $('jl-rep').hidden=true;
  state.day++; state.dayTime=0; state.dayIncome=0; state.dayOrders=0; state.dayCost=0; state.spawnTimer=1.5;
  if(state.orders.length>0){ state.reputation=Math.max(0,state.reputation-state.orders.length); }
  state.orders=[];
  PEOPLE=PEOPLE.filter(function(p){return p.kind==='staff'||p.kind==='boss'});
  toast("☀️ Hari "+state.day+" dimulai! Semangat, Juragan!");
  ui();
}
$('jl-rep-ok').onclick=nextDay;
setInterval(function(){
  if(!LOADED) return;
  if(!$('jl-rep').hidden) return;
  var dt=0.25;
  state.dayTime+=dt;
  if(state.dayTime>=state.dayLength){ endDay(); ui(); return; }
  state.spawnTimer-=dt;
  if(state.spawnTimer<=0){
    spawnCustomer(false);
    var base=rand(4.5,8);
    var repFactor=state.reputation>70?0.85: state.reputation<40?1.5:1;
    var lvlFactor=Math.max(0.55, 1 - state.level*0.05);
    var boost=(state.boostUntilDay===state.day)?0.5:1;
    var etalaseF=state.facilities.etalase?0.85:1;
    state.spawnTimer=base*repFactor*lvlFactor*boost*etalaseF / (1+(state.shopLevel-1)*0.12);
  }
  state.orders.slice().forEach(function(o){
    if(o.stage===1||o.stage===3||o.stage===5){ o.timer-=dt; if(o.timer<=0){ o.stage++; sfx('selesai'); } }
    var drain=(o.stage===6?0.9:0.55) * (state.hasAC?0.62:1) * (state.facilities.vip?0.7:1);
    o.patience-=drain*dt*2.2;
    if(o.patience<=0){
      markPersonExit(o.id,true);
      state.orders=state.orders.filter(function(x){return x.id!==o.id});
      state.reputation=Math.max(0,state.reputation-6);
      sfx('error');
      toast("😡 "+o.name+" batal! Kelamaan menunggu — reputasi turun.",3200);
    }
  });
  if(state.employees>0){
    var waiting=state.orders.filter(function(o){return o.stage===0||o.stage===2||o.stage===4||o.stage===6;});
    waiting.sort(function(a,b){return a.patience-b.patience});
    for(var i=0;i<Math.min(state.employees,waiting.length);i++){ if(Math.random()<0.55) startStage(waiting[i]); }
  }
  ui();
},250);

<script>
/* ===== Firebase Auth: Masuk dengan Google / Keluar (sesi tersimpan di perangkat oleh Firebase) ===== */
(function(){
  function refreshAkun(){ if(typeof sheet!=='undefined'&&sheet==='akun'&&typeof renderSheet==='function')renderSheet(true); }
  window.gLogin=function(){
    if(typeof firebase==='undefined'||!firebase.auth){toast('⚠️ Login Google belum siap — cek koneksi internet kamu, lalu coba lagi');return}
    try{
      var prov=new firebase.auth.GoogleAuthProvider();
      firebase.auth().signInWithPopup(prov).then(function(){ toast('👋 Selamat datang! Kamu sudah masuk'); }).catch(function(e){
        if(e&&e.code==='auth/popup-closed-by-user')return;
        toast('⚠️ Gagal masuk'+(e&&e.code?' ('+e.code+')':'')+' — izinkan popup buat game ini, lalu coba lagi');
      });
    }catch(err){ toast('⚠️ Gagal masuk: '+err.message); }
  };
  window.gLogout=function(){
    if(typeof firebase==='undefined'||!firebase.auth){ PLAYER.user=null; refreshAkun(); return; }
    firebase.auth().signOut().then(function(){ toast('🚪 Kamu sudah keluar. Progres game tetap tersimpan — sampai jumpa!'); }).catch(function(){ toast('⚠️ Gagal keluar, coba lagi'); });
  };
  document.addEventListener('click',function(e){
    var b=e.target.closest&&e.target.closest('[data-act]'); if(!b||b.disabled)return;
    if(b.dataset.act==='glogin')gLogin();
    else if(b.dataset.act==='glogout')gLogout();
  });
  if(typeof firebase!=='undefined'){
    try{
      if(!firebase.apps.length)firebase.initializeApp(FB_CONFIG);
      firebase.auth().onAuthStateChanged(function(u){
        PLAYER.user=u?{name:u.displayName||'Pemain',email:u.email||'',photo:u.photoURL||''}:null;
        refreshAkun();
      });
    }catch(e){}
  }
})();
</script>
